# Stack completo do projeto: Postgres + backend (Node/Express/Prisma) + nginx
# (estático + proxy pro backend, mesmo domínio — ver nginx/default.conf).
# Não substitui o loop de dev atual (npm start na raiz + node src/server.js
# no backend) — é um caminho adicional pensado pra deploy.
#
# Uso:
#   cp .env.example .env   (preencher POSTGRES_*, JWT_SECRET etc.)
#   docker compose up -d --build
#   docker compose exec backend npx prisma migrate deploy
#   docker compose exec backend npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Teto de CPU/memória — sem isso, um flood de requisições (ou um bug de
    # memória) neste projeto pode consumir os recursos da VPS inteira e
    # derrubar os OUTROS projetos hospedados no mesmo host (não é hipotético:
    # esta VPS já roda vários). restart:unless-stopped garante que um OOM
    # aqui dentro só reinicia ESTE container, não derruba o processo errado
    # lá fora.
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # connection_limit/pool_timeout: sem teto, um pico de pedidos simultâneos
      # abre conexão sem limite até o Postgres recusar (max_connections). Com
      # teto, o pool do Prisma falha rápido (erro tratado no controller) em
      # vez de todo mundo — inclusive requisições saudáveis — ficar pendurado
      # esperando uma conexão livre.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=10&pool_timeout=10
      PORT: 3010
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DOMINIO_BASE: ${DOMINIO_BASE:-}
      TENANT_DEV_PADRAO: ${TENANT_DEV_PADRAO:-}
      ENTREGADOR_NOME: ${ENTREGADOR_NOME:-Equipe de entrega}
      ENTREGADOR_TELEFONE: ${ENTREGADOR_TELEFONE:-}
      TAXA_ENTREGA: ${TAXA_ENTREGA:-7.9}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-}
      SEED_GARCOM_SENHA: ${SEED_GARCOM_SENHA:-}
      SEED_ATENDENTE_SENHA: ${SEED_ATENDENTE_SENHA:-}
      SEED_SUPER_EMAIL: ${SEED_SUPER_EMAIL:-}
      SEED_SUPER_SENHA: ${SEED_SUPER_SENHA:-}
      GAME_JWT_SECRET: ${GAME_JWT_SECRET:-saas_pipes_internal_secure_hmac_secret_2026}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3010"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Allowlist explícito dos arquivos/pastas do front estático — nunca a
      # raiz inteira do repo (exporia backend/, .git/, .claude/ etc. via nginx).
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - "./Bel do Frango - Admin.dc.html:/usr/share/nginx/html/Bel do Frango - Admin.dc.html:ro"
      - "./Bel do Frango - Sistema.dc.html:/usr/share/nginx/html/Bel do Frango - Sistema.dc.html:ro"
      - ./entregador.html:/usr/share/nginx/html/entregador.html:ro
      - ./garcom.html:/usr/share/nginx/html/garcom.html:ro
      - ./atendente.html:/usr/share/nginx/html/atendente.html:ro
      - ./empresa.html:/usr/share/nginx/html/empresa.html:ro
      - ./super.html:/usr/share/nginx/html/super.html:ro
      - ./produtos.html:/usr/share/nginx/html/produtos.html:ro
      - ./scripts:/usr/share/nginx/html/scripts:ro
      - ./styles:/usr/share/nginx/html/styles:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico:ro

volumes:
  pg_data:
  uploads_data:
