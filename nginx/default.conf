# Serve os arquivos estáticos da raiz do projeto e proxeia /api e /uploads pro
# backend (Node/Express, porta 3010) — mesmo domínio, como o código já
# pressupõe (ver comentário "produção roteia /api pro backend via proxy Nginx
# no mesmo domínio" em index.html/Bel do Frango.dc.html). Sem isso,
# resolveTenant.js não consegue ler o subdomínio certo do Host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Acima do limite de 5MB dos uploads (produto/banner/categoria/logo) —
    # sem isso o nginx corta o upload antes de chegar no multer.
    client_max_body_size 8m;

    # Mesmos atalhos do scripts/dev-server.js (ALIASES) — paridade com dev.
    # "atendente" não tem atalho lá também, de propósito (só /atendente.html direto).
    # default_type força text/html porque a URL não tem extensão — sem isso o
    # nginx detecta o tipo pelo $uri da requisição (sem extensão), não pelo
    # arquivo do alias, e serve como application/octet-stream (o navegador
    # baixa em vez de renderizar).
    location = /admin { default_type text/html; alias "/usr/share/nginx/html/Bel do Frango - Admin.dc.html"; }
    location = /sistema { default_type text/html; alias "/usr/share/nginx/html/Bel do Frango - Sistema.dc.html"; }
    location = /entregador { default_type text/html; alias /usr/share/nginx/html/entregador.html; }
    location = /garcom { default_type text/html; alias /usr/share/nginx/html/garcom.html; }
    location = /empresa { default_type text/html; alias /usr/share/nginx/html/empresa.html; }
    location = /super { default_type text/html; alias /usr/share/nginx/html/super.html; }

    location /api/ {
        proxy_pass http://backend:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3010/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subdomínio "super.<qualquer-base>" é o painel do dono da plataforma
    # (mesma convenção de resolveSlug no backend — primeiro label = "super"),
    # não uma loja — sem isso a raiz cai no index.html normal (a loja) mesmo
    # nesse subdomínio, porque nginx não sabe nada sobre tenant/subdomínio.
    location = / {
        if ($host ~* "^super\.") {
            rewrite ^ /super last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
