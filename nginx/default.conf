# Serve os arquivos estáticos da raiz do projeto e proxeia /api e /uploads pro
# backend (Node/Express, porta 3010) — mesmo domínio, como o código já
# pressupõe (ver comentário "produção roteia /api pro backend via proxy Nginx
# no mesmo domínio" em index.html/Bel do Frango.dc.html). Sem isso,
# resolveTenant.js não consegue ler o subdomínio certo do Host.

# 1a barreira contra flood (pedidos falsos, varredura, DoS de baixo volume) —
# rejeita aqui, antes do Node gastar CPU/conexão de banco processando. Não
# substitui o express-rate-limit do backend (esse é por-rota/por-regra de
# negócio), é uma camada mais barata na frente dele. Por IP: um IP abusivo
# nunca consome a cota de outro tenant/cliente legítimo.
#
# api_geral: um ÚNICO carregamento da loja (index.html) já dispara uns 10
# GETs quase simultâneos (config, categorias, subcategorias, banners,
# proteínas, complementos, bairros, produtos, tamanhos de marmita,
# configuração) — burst baixo demais aqui derruba a loja pra um cliente
# normal navegando/recarregando, não só pra quem está de fato floodando
# (era o caso antes: burst=20 rate=60r/m gerou 429 em /api/bairros numa
# carga de página normal e a tela ficou sem categoria/produto nenhum).
limit_req_zone $binary_remote_addr zone=api_geral:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_pedidos:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conexoes_por_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Acima do maior limite de upload do multer (10MB, banners/logo — ver
    # utils/upload.js) — sem isso o nginx corta o upload antes de chegar no
    # multer, e o usuário vê um 413 cru em vez da mensagem amigável.
    client_max_body_size 12m;

    # Timeouts curtos — sem isso uma conexão lenta/maliciosa (slowloris: abre
    # a conexão e manda o body byte a byte) fica segurando o worker do nginx
    # até fechar sozinha. 20 conexões simultâneas por IP já cobre um cliente
    # normal (várias abas/imagens em paralelo) sem deixar um único IP tomar
    # os workers do processo (worker_connections é finito).
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    limit_conn conexoes_por_ip 40;

    # Mesmos atalhos do scripts/dev-server.js (ALIASES) — paridade com dev.
    # "atendente" não tem atalho lá também, de propósito (só /atendente.html direto).
    # default_type força text/html porque a URL não tem extensão — sem isso o
    # nginx detecta o tipo pelo $uri da requisição (sem extensão), não pelo
    # arquivo do alias, e serve como application/octet-stream (o navegador
    # baixa em vez de renderizar).
    # Cache-Control: no-cache nas páginas HTML — sem isso, um deploy que troca
    # markup/refs de asset (ex: remover uma imagem que o HTML antigo ainda
    # referencia) fica quebrado no navegador de quem já visitou até um hard
    # refresh manual. Não afeta /api, /uploads nem os assets estáticos
    # (imagem/css/js), só as próprias páginas.
    location = /admin { default_type text/html; add_header Cache-Control "no-cache"; alias "/usr/share/nginx/html/Bel do Frango - Admin.dc.html"; }
    location = /sistema { default_type text/html; add_header Cache-Control "no-cache"; alias "/usr/share/nginx/html/Bel do Frango - Sistema.dc.html"; }
    location = /entregador { default_type text/html; add_header Cache-Control "no-cache"; alias /usr/share/nginx/html/entregador.html; }
    location = /garcom { default_type text/html; add_header Cache-Control "no-cache"; alias /usr/share/nginx/html/garcom.html; }
    location = /atendente { default_type text/html; add_header Cache-Control "no-cache"; alias /usr/share/nginx/html/atendente.html; }
    location = /empresa { default_type text/html; add_header Cache-Control "no-cache"; alias /usr/share/nginx/html/empresa.html; }
    location = /super { default_type text/html; add_header Cache-Control "no-cache"; alias /usr/share/nginx/html/super.html; }

    # Requests diretos a um .html (ex: /atendente.html) — mesmo motivo acima.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Criação de pedido é o alvo natural de flood (grava no banco, cada um
    # aparece na fila da cozinha) — cota própria, mais apertada que o resto
    # da API. burst=5 nodelay: absorve um clique duplo/retry de rede sem
    # atraso, mas nunca deixa acumular fila de requisições represadas.
    location /api/pedidos {
        limit_req zone=api_pedidos burst=5 nodelay;
        proxy_pass http://backend:3010/api/pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_geral burst=60 nodelay;
        proxy_pass http://backend:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3010/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subdomínio "super.<qualquer-base>" é o painel do dono da plataforma
    # (mesma convenção de resolveSlug no backend — primeiro label = "super"),
    # não uma loja — sem isso a raiz cai no index.html normal (a loja) mesmo
    # nesse subdomínio, porque nginx não sabe nada sobre tenant/subdomínio.
    location = / {
        if ($host ~* "^super\.") {
            rewrite ^ /super last;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
