# Serve os arquivos estáticos da raiz do projeto e proxeia /api e /uploads pro
# backend (Node/Express, porta 3010) — mesmo domínio, como o código já
# pressupõe (ver comentário "produção roteia /api pro backend via proxy Nginx
# no mesmo domínio" em index.html/Bel do Frango.dc.html). Sem isso,
# resolveTenant.js não consegue ler o subdomínio certo do Host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Acima do limite de 5MB dos uploads (produto/banner/categoria/logo) —
    # sem isso o nginx corta o upload antes de chegar no multer.
    client_max_body_size 8m;

    # Mesmos atalhos do scripts/dev-server.js (ALIASES) — paridade com dev.
    # "atendente" não tem atalho lá também, de propósito (só /atendente.html direto).
    location = /admin { alias "/usr/share/nginx/html/Bel do Frango - Admin.dc.html"; }
    location = /sistema { alias "/usr/share/nginx/html/Bel do Frango - Sistema.dc.html"; }
    location = /entregador { alias /usr/share/nginx/html/entregador.html; }
    location = /garcom { alias /usr/share/nginx/html/garcom.html; }
    location = /empresa { alias /usr/share/nginx/html/empresa.html; }
    location = /super { alias /usr/share/nginx/html/super.html; }

    location /api/ {
        proxy_pass http://backend:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3010/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
