<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Produtos — Plataforma</title>
<script src="scripts/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F6F1E7;color:#1D1009;font-size:15px;}
  input,button,select,textarea{font-family:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #D97706;outline-offset:2px;}
  button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease;cursor:pointer;}
  button:active{transform:scale(.97);}
  @keyframes puUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</helmet>

<!-- ===================== LOADING ===================== -->
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <span style="width:34px;height:34px;border:3px solid rgba(217,119,6,.25);border-top-color:#D97706;border-radius:50%;animation:puSpin .7s linear infinite;"></span>
</div>
<style>@keyframes puSpin{to{transform:rotate(360deg);}}</style>
</sc-if>

<!-- ===================== LOGIN ===================== -->
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%, #6B2E12 0%, #23130B 70%);padding:24px;">
  <div style="width:100%;max-width:380px;background:#FFFBF3;border-radius:24px;padding:32px 28px;box-shadow:0 30px 70px rgba(0,0,0,.4);animation:puUp .3s ease-out;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:24px;">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;color:#1D1009;">Cadastro de Produtos</div>
      <div style="font-size:13px;color:#8C8075;">Login do Super Admin</div>
    </div>
    <label style="display:block;font-size:13px;font-weight:600;color:#6B2E12;margin-bottom:6px;">E-mail</label>
    <input value="{{ loginEmail }}" onChange="{{ onLoginEmail }}" placeholder="super@korentech.com.br" style="{{ inputStyle }}"/>
    <label style="display:block;font-size:13px;font-weight:600;color:#6B2E12;margin:14px 0 6px;">Senha</label>
    <input type="password" value="{{ loginSenha }}" onChange="{{ onLoginSenha }}" placeholder="••••••••" style="{{ inputStyle }}"/>
    <sc-if value="{{ hasLoginErro }}" hint-placeholder-val="{{ false }}"><p style="margin:12px 0 0;font-size:13px;font-weight:600;color:#C0392B;">{{ loginErro }}</p></sc-if>
    <button onClick="{{ fazerLogin }}" style="margin-top:18px;width:100%;background:#D97706;color:#fff;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(217,119,6,.28);">{{ loginBtnLabel }}</button>
  </div>
</div>
</sc-if>

<!-- ===================== APP ===================== -->
<sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
<div style="max-width:560px;margin:0 auto;min-height:100vh;padding:20px 18px 60px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
    <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;margin:0;">Cadastro de Produtos</h1>
    <button onClick="{{ logout }}" style="background:none;border:none;color:#8C8075;font-size:13px;font-weight:600;">Sair</button>
  </div>

  <!-- ---- Escolha do tenant ---- -->
  <div style="background:#fff;border:1px solid rgba(29,16,9,.08);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 12px rgba(29,16,9,.04);">
    <label style="display:block;font-size:13px;font-weight:700;color:#6B2E12;margin-bottom:8px;">Cadastrando para qual loja?</label>
    <select value="{{ tenantSelecionadoId }}" onChange="{{ onSelecionarTenant }}" style="{{ selectStyle }}">
      <option value="">Selecione um tenant...</option>
      <sc-for list="{{ tenantOptions }}" as="t" hint-placeholder-count="4">
        <option value="{{ t.id }}">{{ t.label }}</option>
      </sc-for>
    </select>
  </div>

  <sc-if value="{{ semTenantSelecionado }}" hint-placeholder-val="{{ true }}">
    <div style="text-align:center;padding:60px 20px;color:#8C8075;font-size:14px;">Escolha um tenant acima para começar a cadastrar produtos.</div>
  </sc-if>

  <sc-if value="{{ temTenantSelecionado }}" hint-placeholder-val="{{ false }}">
  <div style="background:#fff;border:1px solid rgba(29,16,9,.08);border-radius:18px;padding:18px;box-shadow:0 4px 12px rgba(29,16,9,.04);">
    <div style="font-weight:700;font-size:14px;margin-bottom:14px;color:#6B2E12;">Novo produto — {{ tenantSelecionadoLabel }}</div>

    <label style="{{ labelStyle }}">Código de barras</label>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <input value="{{ draftCodigoBarras }}" onChange="{{ onDraftCodigoBarras }}" onKeyDown="{{ onCodigoBarrasKeyDown }}" inputmode="numeric" placeholder="Escaneie ou digite o código" style="{{ inputStyle }}" autofocus/>
      <button onClick="{{ buscarCodigoBarras }}" disabled="{{ buscandoCodigoBarras }}" style="flex:none;background:#0284C7;color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:700;font-size:13px;">{{ buscarBtnLabel }}</button>
    </div>

    <label style="{{ labelStyle }}">Nome do produto *</label>
    <input value="{{ draftNome }}" onChange="{{ onDraftNome }}" placeholder="Ex: Coca-Cola 2L" style="{{ inputStyle }}"/>

    <label style="{{ labelStyle }}">Categoria *</label>
    <select value="{{ draftCategoriaId }}" onChange="{{ onDraftCategoria }}" style="{{ selectStyle }}">
      <option value="">Selecione...</option>
      <sc-for list="{{ categoriaOptions }}" as="c" hint-placeholder-count="4">
        <option value="{{ c.id }}">{{ c.nome }}</option>
      </sc-for>
    </select>

    <div style="display:flex;align-items:center;gap:8px;margin:14px 0;">
      <input type="checkbox" checked="{{ draftPorPeso }}" onChange="{{ toggleDraftPorPeso }}" id="pu-porpeso" style="width:18px;height:18px;"/>
      <label for="pu-porpeso" style="font-size:13.5px;font-weight:600;color:#1D1009;">Vendido por peso (kg)</label>
    </div>

    <div style="display:flex;gap:10px;">
      <div style="flex:1;">
        <label style="{{ labelStyle }}">{{ precoLabel }} *</label>
        <input value="{{ draftPreco }}" onChange="{{ onDraftPreco }}" inputmode="decimal" placeholder="0,00" style="{{ inputStyle }}"/>
      </div>
      <div style="flex:1;">
        <label style="{{ labelStyle }}">Custo (opcional)</label>
        <input value="{{ draftCusto }}" onChange="{{ onDraftCusto }}" inputmode="decimal" placeholder="0,00" style="{{ inputStyle }}"/>
      </div>
    </div>

    <sc-if value="{{ draftNaoPorPeso }}" hint-placeholder-val="{{ true }}">
      <label style="{{ labelStyle }}">Estoque</label>
      <input value="{{ draftEstoque }}" onChange="{{ onDraftEstoque }}" inputmode="numeric" placeholder="0" style="{{ inputStyle }}"/>
    </sc-if>

    <label style="{{ labelStyle }}">Foto (opcional)</label>
    <input type="file" accept="image/*" onChange="{{ onDraftFoto }}" style="display:block;font-size:12.5px;margin-bottom:6px;"/>
    <sc-if value="{{ hasDraftFotoPreview }}" hint-placeholder-val="{{ false }}">
      <img sc-camel-src="{{ draftFotoPreview }}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:12px;margin:6px 0 14px;display:block;"/>
    </sc-if>

    <button onClick="{{ salvarProduto }}" disabled="{{ salvando }}" style="margin-top:8px;width:100%;background:#2D9E60;color:#fff;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(45,158,96,.28);">{{ salvarBtnLabel }}</button>
  </div>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1009;color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;max-width:90vw;text-align:center;">{{ toast }}</div>
  </sc-if>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:900}}">
class Component extends DCLogic {
  apiBase = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3010/api'
    : '/api';

  state = {
    screen: 'loading', // loading | login | app
    loginForm: { email:'', senha:'' }, loginErro:'', loggingIn:false,
    superAdmin: null,
    tenants: [],
    tenantSelecionadoId: '',
    categorias: [],
    draft: this.draftVazio(),
    buscandoCodigoBarras: false,
    salvando: false,
    toast: '',
  };

  draftVazio(){
    return { codigoBarras:'', nome:'', categoriaId:'', porPeso:false, preco:'', custo:'', estoque:'', fotoFile:null, fotoPreview:null };
  }

  showToast(m){ this.setState({ toast:m }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast:'' }), 2500); }

  async apiCall(path, opts){
    const res = await fetch(this.apiBase + path, { credentials:'include', ...opts });
    let data = null;
    try { data = await res.json(); } catch (e) { /* resposta sem corpo */ }
    if (!res.ok) { const erro = new Error((data && data.erro) || ('Erro ' + res.status)); erro.status = res.status; throw erro; }
    return data;
  }
  apiGet(path){ return this.apiCall(path, { method:'GET' }); }
  apiSend(method, path, body){ return this.apiCall(path, { method, headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }); }
  apiUpload(path, formData){ return this.apiCall(path, { method:'POST', body: formData }); }

  async componentDidMount(){
    try {
      const { superAdmin } = await this.apiGet('/super/me');
      this.setState({ superAdmin, screen:'app' });
      await this.carregarTenants();
    } catch (e) {
      this.setState({ screen:'login' });
    }
  }

  onLoginEmail(e){ this.setState(s => ({ loginForm:{ ...s.loginForm, email:e.target.value } })); }
  onLoginSenha(e){ this.setState(s => ({ loginForm:{ ...s.loginForm, senha:e.target.value } })); }
  async fazerLogin(){
    const { email, senha } = this.state.loginForm;
    if (!email || !senha) { this.setState({ loginErro:'Informe email e senha' }); return; }
    this.setState({ loggingIn:true, loginErro:'' });
    try {
      const { superAdmin } = await this.apiSend('POST', '/super/login', { email, senha });
      this.setState({ superAdmin, loggingIn:false, screen:'app' });
      await this.carregarTenants();
    } catch (e) {
      this.setState({ loggingIn:false, loginErro: e.message || 'Email ou senha incorretos' });
    }
  }
  async logout(){
    try { await this.apiSend('POST', '/super/logout', {}); } catch (e) { /* mesmo se falhar, limpa local */ }
    this.setState({ superAdmin:null, screen:'login', tenantSelecionadoId:'', draft:this.draftVazio() });
  }

  async carregarTenants(){
    const tenants = await this.apiGet('/super/tenants');
    this.setState({ tenants });
  }

  async onSelecionarTenant(e){
    const id = e.target.value;
    this.setState({ tenantSelecionadoId: id, categorias:[], draft:this.draftVazio() });
    if (!id) return;
    try {
      const categorias = await this.apiGet('/super/tenants/' + id + '/categorias');
      this.setState({ categorias });
    } catch (e) {
      this.showToast(e.message || 'Erro ao carregar categorias do tenant');
    }
  }

  onDraftCodigoBarras(e){ this.setState(s => ({ draft:{ ...s.draft, codigoBarras:e.target.value } })); }
  onDraftNome(e){ this.setState(s => ({ draft:{ ...s.draft, nome:e.target.value } })); }
  onDraftCategoria(e){ this.setState(s => ({ draft:{ ...s.draft, categoriaId:e.target.value } })); }
  onDraftPreco(e){ this.setState(s => ({ draft:{ ...s.draft, preco:e.target.value } })); }
  onDraftCusto(e){ this.setState(s => ({ draft:{ ...s.draft, custo:e.target.value } })); }
  onDraftEstoque(e){ this.setState(s => ({ draft:{ ...s.draft, estoque:e.target.value } })); }
  toggleDraftPorPeso(){ this.setState(s => ({ draft:{ ...s.draft, porPeso: !s.draft.porPeso } })); }
  onDraftFoto(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => this.setState(s => ({ draft:{ ...s.draft, fotoFile:file, fotoPreview:reader.result } }));
    reader.readAsDataURL(file);
  }

  onCodigoBarrasKeyDown(e){ if (e.key === 'Enter') { e.preventDefault(); this.buscarCodigoBarras(); } }
  async buscarCodigoBarras(){
    const codigo = String(this.state.draft.codigoBarras || '').replace(/\D/g, '');
    if (this.state.buscandoCodigoBarras) return;
    if (codigo.length < 8) { this.showToast('Digite o código de barras completo antes de buscar'); return; }
    this.setState({ buscandoCodigoBarras:true });
    try {
      const p = await this.apiGet('/super/produtos/codigo-barras/' + codigo);
      this.setState(s => ({ draft:{ ...s.draft, nome: (s.draft.nome || '').trim() ? s.draft.nome : (p.nome || '') } }));
      this.showToast('Produto encontrado: ' + p.nome);
    } catch (e) {
      this.showToast(e.status === 404 ? 'Código não encontrado na base Open Food Facts' : (e.message || 'Erro ao buscar código de barras'));
    }
    this.setState({ buscandoCodigoBarras:false });
  }

  async salvarProduto(){
    const { tenantSelecionadoId: tenantId, draft: d } = this.state;
    if (!tenantId) { this.showToast('Escolha um tenant primeiro'); return; }
    if (!d.nome.trim()) { this.showToast('Informe o nome do produto'); return; }
    if (!d.categoriaId) { this.showToast('Escolha uma categoria'); return; }
    if (!d.preco || isNaN(Number(String(d.preco).replace(',', '.')))) { this.showToast('Informe um preço válido'); return; }

    this.setState({ salvando:true });
    try {
      const body = {
        nome: d.nome.trim(),
        categoriaId: d.categoriaId,
        preco: Number(String(d.preco).replace(',', '.')),
        custo: d.custo ? Number(String(d.custo).replace(',', '.')) : null,
        codigoBarras: d.codigoBarras ? d.codigoBarras.replace(/\D/g, '') : null,
        vendidoPorPeso: d.porPeso,
        estoque: d.porPeso ? 0 : (parseInt(d.estoque, 10) || 0),
      };
      const produto = await this.apiSend('POST', '/super/tenants/' + tenantId + '/produtos', body);

      if (d.fotoFile) {
        const fd = new FormData();
        fd.append('foto', d.fotoFile);
        await this.apiUpload('/super/tenants/' + tenantId + '/produtos/' + produto.id + '/foto', fd);
      }

      this.showToast('Produto "' + produto.nome + '" cadastrado!');
      // Mantém o tenant e a categoria selecionados — agiliza cadastrar vários
      // produtos seguidos pro mesmo tenant (é o uso principal desta tela).
      this.setState(s => ({ salvando:false, draft:{ ...this.draftVazio(), categoriaId: s.draft.categoriaId } }));
    } catch (e) {
      this.setState({ salvando:false });
      this.showToast(e.message || 'Erro ao cadastrar produto');
    }
  }

  renderVals(){
    const s = this.state;
    const inputStyle = { flex:'1', width:'100%', border:'1px solid rgba(29,16,9,.14)', background:'#fff', borderRadius:'12px', padding:'12px 14px', fontSize:'14px', color:'#1D1009', outline:'none', marginBottom:'14px' };
    const selectStyle = { ...inputStyle, marginBottom:'0' };
    const labelStyle = { display:'block', fontSize:'12.5px', fontWeight:'600', color:'#6B2E12', marginBottom:'5px' };

    const tenantOptions = s.tenants.map((t) => ({ id:t.id, label: t.nome + ' (' + t.slug + ')' }));
    const tenantAtual = s.tenants.find((t) => t.id === s.tenantSelecionadoId);
    const categoriaOptions = s.categorias.filter((c) => c.nome !== 'Marmitas').map((c) => ({ id:c.id, nome:c.nome }));

    return {
      isLoading: s.screen === 'loading', isLogin: s.screen === 'login', isApp: s.screen === 'app',
      loginEmail:s.loginForm.email, onLoginEmail:(e) => this.onLoginEmail(e),
      loginSenha:s.loginForm.senha, onLoginSenha:(e) => this.onLoginSenha(e),
      fazerLogin:() => this.fazerLogin(), loginBtnLabel: s.loggingIn ? 'Entrando...' : 'Entrar',
      hasLoginErro: !!s.loginErro, loginErro: s.loginErro,
      logout:() => this.logout(),
      inputStyle, selectStyle, labelStyle,

      tenantOptions, tenantSelecionadoId: s.tenantSelecionadoId, onSelecionarTenant:(e) => this.onSelecionarTenant(e),
      semTenantSelecionado: !s.tenantSelecionadoId, temTenantSelecionado: !!s.tenantSelecionadoId,
      tenantSelecionadoLabel: tenantAtual ? tenantAtual.nome : '',

      categoriaOptions,
      draftCodigoBarras: s.draft.codigoBarras, onDraftCodigoBarras:(e) => this.onDraftCodigoBarras(e),
      onCodigoBarrasKeyDown:(e) => this.onCodigoBarrasKeyDown(e),
      buscarCodigoBarras:() => this.buscarCodigoBarras(), buscandoCodigoBarras: s.buscandoCodigoBarras,
      buscarBtnLabel: s.buscandoCodigoBarras ? '...' : 'Buscar',
      draftNome: s.draft.nome, onDraftNome:(e) => this.onDraftNome(e),
      draftCategoriaId: s.draft.categoriaId, onDraftCategoria:(e) => this.onDraftCategoria(e),
      draftPorPeso: s.draft.porPeso, toggleDraftPorPeso:() => this.toggleDraftPorPeso(),
      draftNaoPorPeso: !s.draft.porPeso,
      precoLabel: s.draft.porPeso ? 'Preço por kg (R$)' : 'Preço (R$)',
      draftPreco: s.draft.preco, onDraftPreco:(e) => this.onDraftPreco(e),
      draftCusto: s.draft.custo, onDraftCusto:(e) => this.onDraftCusto(e),
      draftEstoque: s.draft.estoque, onDraftEstoque:(e) => this.onDraftEstoque(e),
      onDraftFoto:(e) => this.onDraftFoto(e),
      hasDraftFotoPreview: !!s.draft.fotoPreview, draftFotoPreview: s.draft.fotoPreview || '',
      salvarProduto:() => this.salvarProduto(), salvando: s.salvando,
      salvarBtnLabel: s.salvando ? 'Salvando...' : 'Cadastrar produto',

      hasToast: !!s.toast, toast: s.toast,
    };
  }
}
</script>
</body>
</html>
